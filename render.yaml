# ═══════════════════════════════════════════════════════════════
#  Render.com Deployment Configuration
#  SME Metadata Governance Framework
# ═══════════════════════════════════════════════════════════════

services:
  - type: web
    name: sme-governance-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sme-governance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: sme-governance-db
    databaseName: sme_governance
    user: gov_admin
    plan: free
